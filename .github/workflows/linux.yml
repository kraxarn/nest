name: Linux

on: [ push, pull_request ]

jobs:
  build:
    name: '${{ matrix.arch }}'
    runs-on: ${{ matrix.os }}
    container: ubuntu:latest
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64

          - os: ubuntu-24.04-arm
            arch: arm64

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'

      - name: Build
        run: go build -v ./...
